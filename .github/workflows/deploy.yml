name: 🚀 CI/CD Pipeline (NNI001 - Automatizaciones)

on:
  push:
    branches:
      - develop
      - main
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'docs/**'
  pull_request:
    branches:
      - develop
      - main
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: 🧪 CI - Compose & Config Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐳 Validate Docker Compose Files
        run: |
          docker compose -f compose.dev.yml config -q
          docker compose -f compose.prod.yml config -q
          echo "✅ Docker Compose configs para n8n validadas con éxito."

  deploy:
    name: 🚀 Deploy to VPS
    needs: ci
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 📦 Sync files to VPS via SSH
        uses: easingthemes/ssh-deploy@v5.1.0
        with:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.VPS_HOST }}
          REMOTE_USER: ${{ secrets.VPS_USER }}
          REMOTE_PORT: ${{ secrets.VPS_PORT }}
          SOURCE: "./"
          TARGET: ${{ github.ref_name == 'develop' && '/srv/somosim/ni001d' || '/srv/somosim/ni001' }}
          ARGS: "-rlgoDzvc -i --delete"
          EXCLUDE: "/.git/, /.env.dev, /.env.prod"

      - name: 🐳 Rebuild & Up Docker Compose on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e
            if [ "${{ github.ref_name }}" = "develop" ]; then
              cd /srv/somosim/ni001d
              docker compose -f compose.dev.yml up -d --remove-orphans
            else
              cd /srv/somosim/ni001
              docker compose -f compose.prod.yml up -d --remove-orphans
            fi
            echo "✅ Despliegue de Automatizaciones n8n (${{ github.ref_name }}) completado con éxito."
