name: Deploy nni001 (Automatizaciones SomosIM)

on:
  push:
    branches:
      - develop
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            if [ "${{ github.ref }}" = "refs/heads/develop" ]; then
              TARGET_DIR="/srv/somosim/ni001d"
            else
              TARGET_DIR="/srv/somosim/ni001"
            fi
            
            echo "🚀 Desplegando en $TARGET_DIR..."
            mkdir -p "$TARGET_DIR"
            cd "$TARGET_DIR"
            docker compose up -d
